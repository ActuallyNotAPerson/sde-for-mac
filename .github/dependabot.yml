# Dependabot opens pull requests to keep the NuGet packages and the GitHub Actions used by the workflows up to date.
# Security updates are separate (Settings, Advanced Security) and arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # PDFsharp and MigraDoc 6.5 and later are AGPL-3.0 or commercial and need a license key. SDE for Mac is MIT,
      # so they stay on 6.2.x, the last MIT release.
      - dependency-name: "PDFsharp*"
        versions: [">= 6.5.0"]
      # SkiaSharp has to match the native library Avalonia ships (SkiaSharp 3 for Avalonia 12.1). Move to a new major
      # version only together with an Avalonia release that uses it.
      - dependency-name: "SkiaSharp*"
        update-types: ["version-update:semver-major"]
      # Svg.Skia and the packages under it no longer ship: the map library (Mapsui) names them, but SDE.app leaves them
      # out (Svg.Custom is MS-PL) and never draws SVG symbols. Their versions stay pinned in Directory.Packages.props only
      # so that the exclusion resolves; a new major (built on SkiaSharp 4) would not resolve against SkiaSharp 3.
      - dependency-name: "Svg.Skia"
        update-types: ["version-update:semver-major"]
      # Mapsui must stay on a release built for Avalonia 12 and SkiaSharp 3; a new major is checked by hand.
      - dependency-name: "Mapsui*"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates in one pull request a month; major versions each get their own.
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
