name: Release

# Pushing a tag such as v2.0.0 builds SDE.app for Apple Silicon and Intel Macs and attaches both zips, with a
# SHA256SUMS file, to a DRAFT GitHub release. Nothing is public until someone reviews the draft and publishes it.
# Signing and notarization happen only when the repository has the signing secrets; see docs/RELEASING.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  release:
    name: Build, package and draft the release
    runs-on: macos-latest
    # The signing secrets can be kept in this environment (Settings, Environments, release) and limited to v* tags, so
    # no other workflow or branch can read them. Secrets saved for the whole repository work too.
    environment: release
    env:
      # Secrets cannot be tested in a step condition directly, so each is reduced to a true/false flag first.
      HAVE_SIGNING: ${{ secrets.SDE_SIGN_IDENTITY != '' && secrets.SDE_SIGN_P12_BASE64 != '' && secrets.SDE_SIGN_P12_PASSWORD != '' }}
      HAVE_NOTARY: ${{ secrets.SDE_NOTARY_APPLE_ID != '' && secrets.SDE_NOTARY_TEAM_ID != '' && secrets.SDE_NOTARY_PASSWORD != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # package_app.sh names its zips after the <Version> in Sde.App.csproj, so a tag that disagrees would publish
      # files whose names contradict the release.
      - name: Check the tag matches the app version
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Sde.App/Sde.App.csproj)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match <Version>$VERSION</Version> in src/Sde.App/Sde.App.csproj." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The runner has no Developer ID certificate; import the .p12 into a keychain that exists only for this job.
      - name: Import the signing certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.SDE_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SDE_SIGN_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/sde-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sde-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/sde-signing.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/sde-signing.p12"
          echo "SDE_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build SDE.app for both Macs
        run: bash tools/packaging/package_app.sh osx-arm64 osx-x64

      # Builds mdb-export and mdb-tables from the pinned mdbtools source into each app bundle (Intel cross-compiled);
      # the signing step below then covers those programs too. Needs only the Xcode command line tools.
      - name: Bundle mdbtools
        run: bash tools/packaging/build_mdbtools.sh osx-arm64 osx-x64

      - name: Sign, notarize and zip
        env:
          SDE_SIGN_IDENTITY: ${{ env.HAVE_SIGNING == 'true' && secrets.SDE_SIGN_IDENTITY || '' }}
          SDE_NOTARY_APPLE_ID: ${{ env.HAVE_SIGNING == 'true' && env.HAVE_NOTARY == 'true' && secrets.SDE_NOTARY_APPLE_ID || '' }}
          SDE_NOTARY_TEAM_ID: ${{ env.HAVE_SIGNING == 'true' && env.HAVE_NOTARY == 'true' && secrets.SDE_NOTARY_TEAM_ID || '' }}
          SDE_NOTARY_PASSWORD: ${{ env.HAVE_SIGNING == 'true' && env.HAVE_NOTARY == 'true' && secrets.SDE_NOTARY_PASSWORD || '' }}
        run: bash tools/packaging/sign_app.sh osx-arm64 osx-x64

      - name: Write checksums
        run: |
          cd out
          shasum -a 256 "SDE-$VERSION-osx-arm64.zip" "SDE-$VERSION-osx-x64.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="out/SDE-$VERSION-osx-arm64.zip out/SDE-$VERSION-osx-x64.zip out/SHA256SUMS"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run of the same tag: replace the files on the existing release.
            gh release upload "$GITHUB_REF_NAME" $FILES --clobber
          else
            case "$GITHUB_REF_NAME" in
              *-*) PRERELEASE="--prerelease" ;;
              *) PRERELEASE="" ;;
            esac
            gh release create "$GITHUB_REF_NAME" $FILES --draft $PRERELEASE --title "SDE for Mac $VERSION" --generate-notes
          fi

      - name: Keep the zips as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SDE-${{ env.VERSION }}
          path: |
            out/SDE-*.zip
            out/SHA256SUMS

      - name: Remove the temporary keychain
        if: always() && env.SDE_KEYCHAIN != ''
        run: security delete-keychain "$SDE_KEYCHAIN" || true
