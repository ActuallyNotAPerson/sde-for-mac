name: Something isn't working
description: The app crashes, shows an error, or does something it shouldn't.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Please don't include real owner names, addresses, parcel numbers or photos**:
        this page is public. Describe the building's values instead, or use a made-up copy of it.

        If a result differs from FEMA's SDE on Windows, use the "Result differs from FEMA's SDE" form instead. For a
        security problem, don't open an issue: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: SDE for Mac version
      description: Settings, then About, shows it.
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Your Mac
      options:
        - Apple silicon (M1 or newer)
        - Intel
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Apple menu, then About This Mac.
      placeholder: "macOS 15.4"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact wording of any message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      placeholder: |
        1. Open Structures
        2. Check two structures
        3. Choose Export, then To Excel
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: |
        Help, then Show Log Folder, opens the log files. Paste the lines from around the time of the problem.
        Read them first and remove anything personal.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Personal information
      options:
        - label: This report contains no real owner names, addresses, parcel numbers or photos.
          required: true
